<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Set New Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        height: 100vh;
        background: linear-gradient(135deg, #0a1931, #185adb);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #111;
        border-radius: 1rem;
        padding: 2rem;
        width: 400px;
        color: #fff;
      }
      h3 {
        color: #00b4d8;
      }
      .form-control {
        background: #222;
        border: 1px solid #333;
        color: #fff;
      }
      .form-control:focus {
        border-color: #00b4d8;
        box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25);
      }
      .btn-custom {
        background: linear-gradient(45deg, #185adb, #00b4d8);
        border: none;
        color: white;
      }
      .btn-custom:hover {
        background: linear-gradient(45deg, #00b4d8, #185adb);
      }
    </style>
  </head>
  <body>
    <div class="card shadow-lg">
      <h3 class="text-center mb-3">Set New Password</h3>
      <form method="post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-custom w-100 mt-3">
          Reset Password
        </button>
      </form>
    </div>
  </body>
</html>
