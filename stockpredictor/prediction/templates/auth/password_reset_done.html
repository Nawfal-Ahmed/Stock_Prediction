<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset Sent</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        height: 100vh;
        background: linear-gradient(135deg, #0a1931, #185adb);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
      }
      .card {
        background: #111;
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        color: #fff;
      }
      h3 {
        color: #00b4d8;
      }
    </style>
  </head>
  <body>
    <div class="card shadow-lg">
      <h3>Password Reset Email Sent</h3>
      <p>
        We’ve emailed you instructions for resetting your password. Please check
        your inbox.
      </p>
      <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
    </div>
  </body>
</html>
