{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300b4d8'/><path d='M20 70 L40 50 L60 60 L80 30' stroke='white' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='80' cy='30' r='10' fill='%23ff4757'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #0a1931, #185adb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border: none;
      border-radius: 1rem;
      background: #111;
      color: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    .card h3 {
      color: #00b4d8;
      font-weight: 600;
    }
    .form-control {
      background-color: #222;
      border: 1px solid #333;
      color: #fff;
    }
    .form-control:focus {
      background-color: #222;
      border-color: #00b4d8;
      color: #fff;
      box-shadow: 0 0 0 .25rem rgba(0, 180, 216, 0.25);
    }
    .btn-custom {
      background: linear-gradient(45deg, #185adb, #00b4d8);
      border: none;
      font-weight: 600;
      color: white;
      transition: all 0.3s ease-in-out;
    }
    .btn-custom:hover {
      background: linear-gradient(45deg, #00b4d8, #185adb);
      transform: scale(1.02);
    }
    a {
      color: #00b4d8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-lg">
          <div class="card-body">
            <h3 class="text-center mb-4">Welcome Back</h3>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-warning text-center">{{ message }}</div>
              {% endfor %}
            {% endif %}

            <form method="post" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
              </div>
              <button class="btn btn-custom w-100 py-2">Login</button>
            </form>

            <p class="mt-4 text-center">
              Don’t have an account? <a href="{% url 'signup' %}">Register</a>
            </p>
            <p class="text-center mb-0">
              <a href="{% url 'password_reset' %}">Forgot Password?</a>
            </p>
            <div class="mt-4 p-3 rounded text-center" style="background: rgba(255, 255, 255, 0.05); border: 1px dashed rgba(255, 255, 255, 0.15);">
              <small class="text-muted d-block mb-1">Demo / Admin Credentials</small>
              <code style="color: #00b4d8; font-size: 0.95rem;">Username: admin</code><br>
              <code style="color: #00b4d8; font-size: 0.95rem;">Password: admin123</code>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
