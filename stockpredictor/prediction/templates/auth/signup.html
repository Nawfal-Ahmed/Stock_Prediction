{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #0a1931, #185adb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border: none;
      border-radius: 1rem;
      background: #111;
      color: #fff;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    .card h3 {
      color: #00b4d8;
      font-weight: 600;
    }
    .form-control {
      background-color: #222;
      border: 1px solid #333;
      color: #fff;
    }
    .form-control:focus {
      background-color: #222;
      border-color: #00b4d8;
      color: #fff;
      box-shadow: 0 0 0 .25rem rgba(0, 180, 216, 0.25);
    }
    .btn-custom {
      background: linear-gradient(45deg, #185adb, #00b4d8);
      border: none;
      font-weight: 600;
      color: white;
      transition: all 0.3s ease-in-out;
    }
    .btn-custom:hover {
      background: linear-gradient(45deg, #00b4d8, #185adb);
      transform: scale(1.02);
    }
    a {
      color: #00b4d8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card p-4 shadow-lg">
          <div class="card-body">
            <h3 class="text-center mb-4">Create Account</h3>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-warning text-center">{{ message }}</div>
              {% endfor %}
            {% endif %}

           <form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Username</label>
    <input type="text" name="username" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Confirm Password</label>
    <input type="password" name="confirm" class="form-control" required>
  </div>
  <button class="btn btn-custom w-100 py-2">Sign Up</button>
</form>


            <p class="mt-4 text-center">
              Already have an account? <a href="{% url 'login' %}">Login</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
