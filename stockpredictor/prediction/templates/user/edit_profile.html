{% extends 'base.html' %} {% block content %}
<div class="container mt-5">
  <h2 class="text-primary">Edit Profile</h2>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Username:</label>
      <input
        type="text"
        name="username"
        value="{{ user.username }}"
        class="form-control"
      />
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input
        type="email"
        name="email"
        value="{{ user.email }}"
        class="form-control"
      />
    </div>
    <button type="submit" class="btn btn-success mt-3">Update</button>
  </form>
</div>
{% endblock %}
