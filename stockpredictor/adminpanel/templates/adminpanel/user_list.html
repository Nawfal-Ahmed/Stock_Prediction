{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h3>👥 User Management</h3>

  <table class="table table-striped table-dark mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Date Joined</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.full_name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.last_login }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4">No users found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
